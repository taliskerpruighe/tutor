    rule: "family_name + given_name identical across N-400 current-name fields, passport MRZ, green card, tax return, and every cover/divider page"
    value: "Vu / Thanh / Ha everywhere EXCEPT N-400 Part 2 Item 3, which alone carries Tran / Ha / Thanh (the request)"
    comparison_mode: "see documents.passport.name_lock_rule — MRZ given-names field compares against upper(middle_name + ' ' + given_name), not given_name alone, because of Vietnamese name ordering"
