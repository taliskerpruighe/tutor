_authored_notes:
  disagreements:
    n400_part_numbering_verified:
      finding: 'At draft time, `lab/synthetic/tools/n400-part-map.md` (and SPEC-DELTA D-H, which depended
        on it) stated the committed 01/20/25 blank''s applicant-contact block is printed Part 10 and its
        preparer block is printed Part 12, with "no Part 13." That table was built from the blank''s AcroForm
        /TU tooltips. This masterkey writer checked the primary source instead — `pdftotext -f 9 -l 14
        -layout blanks/n-400.pdf -` — and found the tooltips internally scrambled (e.g. field `P10_Line1_Citizen`
        on page 11 is tooltipped "Part 7. Marital History," nowhere near its actual content), while the
        PRINTED page text runs Part 9 (Additional Information About You) -> Part 10 (Request for a Fee
        Reduction) -> **Part 11 (Applicant''s Contact Information, Certification, and Signature)** ->
        Part 12 (Interpreter''s Contact Information...) -> **Part 13 (Contact Information, Certification,
        and Signature of the Person Preparing this Application)** -> Part 14 (Additional Information)
        -> Part 15 (Signature at Interview) -> Part 16 (Oath of Allegiance). brief.md''s own wording ("Part
        11 filled ... Part 13 empty") already matched the printed numbering.

        '
      status: 'CONFIRMED UPSTREAM 2026-08-22. `lab/synthetic/spec/SPEC-DELTA.md` now carries D-H2 (superseding
        D-H) and `lab/synthetic/tools/n400-part-map.md` now carries the corrected table, both crediting
        this finding and both stating: printed Part 11 = applicant contact (FILL daytime/mobile/email,
        LEAVE EMPTY signature+date), printed Part 13 = preparer block (LEAVE EMPTY entirely). §16 rulings
        10 and 11 apply LITERALLY, with no reinterpretation needed. No open disagreement remains; this
        entry is kept as the provenance record for that upstream correction.

        '
      consequence_for_this_masterkey: 'None — this masterkey is fact-domain organised per BUILD-PLAN §3
        and carries no printed-Part-number labels for the contact/preparer blocks (see identity.contact.n400_field_note);
        it names the actual field IDs, which are independently verified to exist in n400-field-dump.tsv
        and are what `render_n400.py` keys on regardless of which Part label is correct.

        '
    registry_date_divergence:
      finding: 'registry.yaml gives Ha''s Gahanna address as 2020-06-01 to 2023-04-19, and her pre-Scioto
        employment as 2020-06-01 to 2023-01-06. Both leave a short gap against other facts already fixed
        elsewhere: the address gap is against identity.first_entered_us (2020-05-27, from brief.md, four
        days before the registry''s address start), and the employment gap (2023-01-06 to 2023-01-09)
        is a bare three days against her verified lab start date. The HARD CONSTRAINTS for this masterkey
        require gap-free addresses AND gap-free employment.

        '
      resolution_in_this_masterkey: 'addresses[1].from and employment[0].from are both set to 2020-05-27
        (her first entry to the U.S. — she cannot have a pre-entry U.S. address or U.S. employment), and
        employment[0].to is set to 2023-01-08 (the day before the verified 2023-01-09 Scioto start, per
        ha_email:0001). Both closures are internally consistent with the brief and with each other; neither
        changes any fact registry.yaml treats as load-bearing (marriage date, LPR date, class of admission,
        basis, exhibit set, lockbox/carrier, tax year — all unchanged).

        '
    county_and_generic_geography_blocklist_hits: 'See the leakage-grep report. "Franklin," "County," and
      "Republic" are single-word blocklist hits that are not corpus proper-noun leakage; see the grep
      report for the discriminator and recommendation. No worked pair carries a deed (only T1 does, via
      C3a), so this is the first client that could have hit the gap.

      '
