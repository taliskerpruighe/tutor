# fact needs a home; never rename an existing key"). NO firm identity anywhere
# (STYLE-SPEC §16 ruling 7) — see NOTE ON PART NUMBERS below for why no
# `preparer` block is carried.
#
# NOTE ON PART NUMBERS (found during the required primary-source check,
# `pdftotext -f 6 -l 11 -layout lab/synthetic/blanks/n-400.pdf -`, then cross-
# checked against pages 1-4 and 12-14 and against registry.yaml's own
# `n400_policy` block): the committed 01/20/25 blank's VISIBLE PRINTED TEXT
# gives Part 9 = Additional Information (items 1-37, unchanged from the
# assignment prompt and from `n400-part-map.md`) — but Part 10 = Request for a
# Fee Reduction, Part 11 = Applicant's Contact Info/Certification/Signature,
# Part 12 = Interpreter, Part 13 = Preparer, Part 14 = Additional Information
# space, Part 15 = Signature at Interview, Part 16 = Oath. This is the
# STANDARD current-edition numbering and it is what registry.yaml's own
# `n400_policy` block already uses (`part_11: FILLED`, `part_13: EMPTY`).
# `n400-part-map.md`'s table is mislabelled: its "printed Part (tooltip)"
# column is read from the AcroForm `/TU` tooltip strings (which ARE stale —
# they still carry the prior edition's Part 10/12 numbering) and calls that
# "printed", but the tooltip is invisible metadata, not page text. The FIELD
# NAMES in that file's FILL/LEAVE-EMPTY lists (`P12_Line3_Telephone[0]` etc.)
# are still correct — they were pulled from the real AcroForm — only the Part
# LABEL attached to them is wrong. Net effect on this masterkey: none. The
# only Part-numbered facts this masterkey carries are Part 9 items 1-37,
# which are identical under both readings, and the brief's own prose ("Part
# 11 is filled ... Part 13 stays empty") is literally correct as printed. No
# `preparer_title` field is carried per client — that string is a registry
# (set-level) constant, not a per-client fact (see registry.yaml `firm:`).

