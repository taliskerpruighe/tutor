  q10c: {text: "(gated on 10.a=Yes) threatened to use a weapon against another person", answer: null, not_applicable: true, gating: "10.a is No"}
  q11: {text: "EVER sold/provided/transported weapons believed to be used against a person", answer: "No"}
  q12:
    text: "EVER received weapons training, paramilitary training, or other military-type training"
    answer: "Yes"
    explanation: >
      Standard weapons and basic infantry training received during his
      1976-1978 compulsory Hellenic Army service (see Item 8.a). No training
      beyond ordinary national-service conscription.
    routes_to: "Part 14. Additional Information"
  q13: {text: "EVER recruited/used a person under 15 to serve in or help an armed group", answer: "No"}
  q14: {text: "EVER used a person under 15 to take part in hostilities", answer: "No"}
  q15a: {text: "EVER committed/agreed to commit/asked someone else to commit a crime for which NOT arrested", answer: "No"}
