  q8a:
    text: "EVER served in, been a member of, assisted, or participated in any military or police unit"
    answer: "Yes"
    explanation: >
      Compulsory national service in the Hellenic Army (Greece), Infantry
      Branch, rank Private, 1976-03-01 to 1978-02-28 — routine two-year
      conscription, standard for Greek men of his generation; no combat
      deployment, no disciplinary action, honorable discharge. Per the
      form's own instruction under Item 8.a/8.b, the country, unit, rank and
      dates of involvement are stated in the written explanation (DOCUMENT 8),
      alongside the Item 20 narrative.
    routes_to: "Part 14. Additional Information"
  q8b: {text: "EVER served in/assisted an armed group (paramilitary, self-defense unit, vigilante, rebel, guerrilla)", answer: "No"}
  q9:  {text: "EVER worked/served in a place where people were detained, or directed/participated in detaining people", answer: "No"}
  q10a: {text: "Part of/helped a group that used or threatened a weapon against a person", answer: "No"}
