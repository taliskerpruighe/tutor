# client) > registry.yaml (set-level namespace; one disagreement recorded
# below, see `_notes.registry_vs_brief`) > STYLE-SPEC.md / SPEC-DELTA.md >
# document-catalog.yaml > BUILD-PLAN.md §3 schema. Ground-truthed against the
# committed blank `lab/synthetic/blanks/n-400.pdf` by direct `pdftotext`
# extraction of the printed page text (not the AcroForm /TU tooltips, which
# this build proved unreliable — see `_notes.part_map_discrepancy`).
#
# No firm identity anywhere (STYLE-SPEC §16 ruling 7 / registry D4). No C1,
# C2 or C3 (316(a) bars spousal evidence, STYLE-SPEC §9.3 rule 2). Exhibit
# set is exactly {C4, C6} = 8 documents (registry D1).

