  _notes:
    part_map_discrepancy: 'n400-part-map.md (built from AcroForm /TU tooltips) claims the printed applicant-contact
      block is "Part 10" and the preparer block is "Part 12", with "no Part 13" on this edition. Direct
      `pdftotext -f 1 -l 12 -layout` extraction of the ACTUAL PRINTED PAGE TEXT of the committed lab/synthetic/blanks/n-400.pdf
      disagrees: the real printed sequence is Part 9 (Additional Information About You, items 1-37, pages
      6-10) -> Part 10 (Request for a Fee Reduction, page 10-11) -> Part 11 (Applicant''s Contact Information,
      Certification, and Signature, page 11) -> Part 12 (Interpreter''s Contact Information, page 12)
      -> Part 13 (Contact Information...of the Person Preparing this Application, page 12, WITH fillable
      fields — it exists and is not empty-by-construction). The underlying /TU tooltip TEXT is independently
      self-inconsistent (e.g. interpreter fields tagged "Part 11. Additional Information.. Interpreter''s
      Contact Info", a page-10 checkbox tagged "Part 12. Additional Information About You") — it is stale
      in the same way n400-part-map.md already documented the field NAME prefixes to be stale, but the
      map''s own prose table inherited the stale tooltip TEXT as if it were the printed label. This masterkey
      therefore identifies every N-400 block BY DESCRIPTION (per SPEC-DELTA D-H''s own stated principle
      — "applied to the blocks the user named by description, not by number"), not by a Part number, everywhere
      it matters: `contact:` is the applicant''s own phone/mobile/email block (filled), there is no `preparer:`
      key anywhere (empty, no firm identity), `contact.signature`/`signature_date` are null (unsigned).
      Field-level FILL/LEAVE-EMPTY behaviour still correctly comes from n400-part-map.md''s AcroForm FIELD-NAME
      lists (P12_Line3_Telephone etc.), which are unambiguous regardless of which Part label is attached
      to them; only the prose Part-number labels are wrong, and only in that tool file, not in this masterkey.
      The task''s own instruction to "key moral_character to the printed Part 9 items of THIS edition"
      is VALIDATED by this same extraction: Part 9 truly is items 1-37, and Item 20/Items 15.a-b are exactly
      where both the task and registry.yaml say they are. UPDATE 2026-08-22: this finding was raised upstream
      and n400-part-map.md has since been corrected in place (SPEC-DELTA D-H, superseded by D-H2). The
      corrected file confirms the reading above exactly — printed Part 11 is the applicant''s contact/signature
      block, printed Part 13 is the preparer block and it does exist with fillable fields, and §16 rulings
      10/11 apply literally with no reinterpretation needed. This masterkey''s `contact:` block and the
      absence of any `preparer:` key are already consistent with the corrected file; no changes to this
      masterkey''s facts were needed once the upstream tool file caught up.

      '
    part6_children_discrepancy: 'The task''s "WHAT THE MASTERKEY MUST CARRY" list states "Daphne is his
      child in N-400 Part 6". Direct extraction of the printed Part 6 shows Item 1 asks only for "your
      total number of children UNDER 18 years of age" and Item 2 limits the table to "children identified
      in Item Number 1." Daphne is 42 at filing. She is recorded here as a `family.children` fact (STYLE-SPEC
      §12.5 requires it) but is explicitly marked `on_part6_table: false` with the reasoning inline, so
      Phase 3''s renderer does not mistakenly place an adult daughter in a printed-minors-only table.
      Part 6 Item 1 for this applicant = 0.

      '
    item_8a_finding: 'brief.md''s over-delivery mess list includes "his Greek military discharge paper"
      among documents that "still agree with the masterkey." Printed Part 9 Item 8.a asks broadly: "Have
      you EVER served in, been a member of, assisted, or participated in any military or police unit?"
      — with no carve-out for compulsory service. Konstantinos, born 1957 in Greece, is exactly the demographic
      for Greek compulsory national conscription (near-universal for Greek men of his generation) and
      the brief''s own document manifest puts a discharge paper in his hands. registry.yaml''s per-client
      `moral_character` block instead states "all_other_items: No, except the oath answers, which are
      Yes" — silent on Item 8.a and 12. THIS IS A BRIEF/REGISTRY DISAGREEMENT, flagged loudly per instruction.
      Resolved in favor of brief.md (this client''s designated authoritative source, and the source that
      actually puts the discharge document in the packet''s input pile): q8a = Yes (routine, honorable,
      non-combat compulsory service, 1976-1978), q12 = Yes (ordinary conscript weapons/basic training,
      same service). Both route to Part 14 only, exactly like Item 20 — NEITHER creates a new exhibit,
      NEITHER is an arrest, so C5 still does not fire and the exhibit set is still exactly {C4, C6} =
      8 documents. The written explanation (DOCUMENT 8) carries all three non-tabulable Yeses (8.a, 12,
      20) in one document. Left at registry''s stated "No" for 8.a, the masterkey would directly contradict
      a document the client actually sent — precisely the "unlocatable/contradictory fact" class the task
      calls a challenge-breaking bug for this dogfooded client.

      PHASE 4 UPDATE (2026-08-22): the Phase 2 set review found the residual defect this note left in
      place — the discharge scan was the ONLY input surface for q8a/q12, sitting inertly in the over-delivery
      pile next to two expired passports, a death certificate and a utility bill, right where the voice
      card has Daphne say "ignore whatever isn''t useful." A solver correctly generalising W1 Almeida''s
      demonstrated rule (pile contents are inert) would read the discharge paper as inert too and answer
      both items `No`. Fixed here: email:0004 now states the same facts (Hellenic Army, Infantry, Private,
      1976-03-01 to 1978-02-28, honorable discharge, ordinary conscript weapons/basic training) in Daphne''s
      own prose, as a closing paragraph after the Item 20 narrative, per `immigration.written_explanation_structure.order`.
      `input_surfaces` now lists email:0004 first for both moral_character.q8a and .q12; the discharge
      scan remains a secondary, corroborating surface only. See mess_events "blocking-finding fix" for
      the full resolution.

      '
