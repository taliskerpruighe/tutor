    pob: "Poland"
    issue_date: "2019-05-20"
    expiry_date: "2029-05-19"
    issuing_authority: "Ministry of Foreign Affairs, Republic of Poland"
    mrz:
      line1: "P<POLNOWAK<<AGATA<ZOFIA<<<<<<<<<<<<<<<<<<<<<"
      line2: "AT48271937POL8609306F2905198<<<<<<<<<<<<<<06"
    mrz_check_digits_python:
      # ICAO 9303, weights [7,3,1] cycling, mapping A-Z=10-35, '<'=0
      passport_number_check: 7
      dob_check: 6
      expiry_check: 8
      composite_check: 6
      recomputed: true
      verify_script: |
        def check_digit(s):
            w=[7,3,1]; v={c:int(c) for c in "0123456789"}
            v.update({c:10+i for i,c in enumerate("ABCDEFGHIJKLMNOPQRSTUVWXYZ")}); v['<']=0
            return sum(v[c]*w[i%3] for i,c in enumerate(s)) % 10
        pn="AT4827193<".rstrip()+"<"*0  # pn field is "AT4827193" left as-is, 9 chars, no fill needed
        pn_field="AT4827193"  # 9 chars exactly
        assert check_digit(pn_field) == 7
        assert check_digit("860930") == 6
        assert check_digit("290519") == 8
        composite = pn_field+"7"+"860930"+"6"+"290519"+"8"+"<"*14+"0"
        assert check_digit(composite) == 6

