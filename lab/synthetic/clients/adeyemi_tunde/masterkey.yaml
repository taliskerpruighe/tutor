mess_events:
  - type: "phone-photo documents"
    fact: "identity, immigration.a_number, documents.passport.*, documents.green_card.*"
    wrong_surface: null
    right_surface: "photo:passport_bio, photo:green_card_front, photo:green_card_back, all attached to email:000002"
    resolution: "every fact on every photograph is legible; difficulty is in the count and format only (brief.md), never the pixels"
  - type: "multiple e-mail addresses, the applicant himself"
    fact: "contact.email"
    wrong_surface: "email:000006 sent from t.adeyemi@cardinalpolymer.com (work address, sent while on shift)"
    right_surface: "email:000004 and email:000008, both from tunde.adeyemi@quillmail.com (personal), the latter an explicit confirmation: 'Use tunde.adeyemi@quillmail.com for the form.'"
    resolution: "one person, one thread; Part 11 (contact — see finding above) takes the personal address because that is the address he gives when asked for his contact details, per brief.md"
  - type: "blank questionnaire field, supplied later by e-mail prose — escalated (no questionnaire exists at all)"
    fact: "addresses.0 (412 Wren Street, Verona)"
    wrong_surface: "none — the field was simply never supplied in email:000004 or email:000006, leaving a 2019-09-20..2021-06-14 gap"
    right_surface: "email:000008, after the firm flags the gap at email:000007: 'Correction. Middleton was June 2021 to January 2023. Verona was before that, from September 2019.'"
    resolution: "every consumed fact is stated exactly once, unambiguously, somewhere in the thread — chronological precedence: the later, complete statement in email:000008 wins and closes the gap"
  - type: "password-protected attachment, password in a LATER e-mail — escalated from W3 (where the password was in the SAME message)"
    fact: "documents.tax_return.* (every figure inside the 1040)"
    sequence:
      - {seq: 1, email: "000010", event: "attachment f1040_2025.pdf sent, password-protected. 'The 1040 is attached. It is the joint return for 2025.' NO password included."}
      - {seq: 2, email: "000011", event: "firm: 'The attached return is password-protected. Please send the password.'"}
      - {seq: 3, email: "000012", event: "applicant: 'Password is Cx7-Marlow-2025. It applies to the tax return only.'"}
    resolution: "the password opens the file; there is exactly one password and exactly one protected attachment (brief.md). Password arrives TWO e-mails after the attachment (000010 -> 000012), not in the same message as W3's benign version — the escalation the brief specifies."

