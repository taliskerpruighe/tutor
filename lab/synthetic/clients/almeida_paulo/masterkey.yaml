# masterkey.yaml — almeida_paulo (W1)
# Phase 2b. Single source of truth for this client. Consumed by Phase 3
# renderers, Phase 4 input fabricators, Phase 5 verify_client.py. Nothing
# outside this file is authoritative for almeida_paulo.
#
# Sources read, in order: brief.md, voice-card.md, BUILD-PLAN.md §3,
# STYLE-SPEC.md §12 (+§9, §4.5, §16), SPEC-DELTA.md, document-catalog.yaml,
# n400-part-map.md, registry.yaml. Corpus quarantine honoured — no file
# under lab/jacobs_brent, lab/zhu_vivian, lab/izaguirre_jesus, lab/malone_kyle
# or lab/ossola_ylenia was read.
#
# *** N-400 PART-NUMBERING CORRECTION — READ BEFORE TRUSTING ANY "Part N" KEY
# BELOW ***
# n400-part-map.md (and the task prompt paraphrasing it) states the applicant's
# contact block is "printed Part 10" and the preparer block "printed Part 12",
# with "no Part 13". Direct `pdftotext -layout` extraction of the committed
# blank (`lab/synthetic/blanks/n-400.pdf`, verified below) shows this is WRONG
# for the actual page text. The real printed structure is:
#   Part 9  — Additional Information About You — items 1-37 (pages 6-10)
#   Part 10 — Request for a Fee Reduction (page 11)
#   Part 11 — Applicant's Contact Information, Certification, and Signature (page 11)
#   Part 12 — Interpreter's Contact Information... (page 12)
#   Part 13 — Contact Information... of the Person Preparing this Application (page 12)
#   Part 14 — Additional Information (pages 12-13)
#   Part 15 — Signature at Interview (page 14)
#   Part 16 — Oath of Allegiance (page 14)
# Root cause: the AcroForm fields' /TU tooltips are STALE (they carry the
# PREVIOUS edition's part numbers — e.g. the Part-11 contact fields are
# tooltip-labelled "Part 10", the Part-9 oath pre-questions 26d/34 are
# tooltip-labelled "Part 12"). n400-part-map.md was built from the tooltips,
# not from the rendered page text, which is why it dropped Part 10 (Fee
# Reduction) from its table and shifted everything after Part 9 down by one.
# THE FIELD NAMES AND FILL/EMPTY SEMANTICS in n400-part-map.md ARE CORRECT
# (verified against pypdf's field list below) — only its human "printed Part
# N" labels are off by one from Part 10 onward. This masterkey uses the
# numbers actually printed on the page. See REPORT for the full finding.
n400_numbering_note: >
  Verified 2026-08-21 via `pdftotext -layout lab/synthetic/blanks/n-400.pdf -`
  and `pypdf` field enumeration. Printed Part 10 = Fee Reduction, Part 11 =
  Applicant's Contact Info, Part 12 = Interpreter, Part 13 = Preparer. The
  AcroForm /TU tooltips are stale by one part-number from Part 10 onward;
  field NAMES (P12_Line3_Telephone etc.) and the FILL/EMPTY instructions in
  n400-part-map.md are unaffected and are followed as written.

