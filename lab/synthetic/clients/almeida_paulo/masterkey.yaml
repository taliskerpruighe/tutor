travel:
  # 7 countable trips (Part 8 window: last 5 years) + 1 day trip supplied but
  # excluded from BOTH the Part 8 table and the travel addendum (decision D7).
  # `days` = (return - depart).days + 1, both endpoints inclusive.
  # Part 8 table holds exactly 6 rows (page 6 of 14, confirmed by direct field
  # count on the committed blank — D7 verified_fact); the 7th countable trip
  # (oldest) is on the addendum only, per §9.3.5's superset rule.
  trips:
  - depart: "2025-09-05"
    return: "2025-09-14"
    countries: ["Brazil"]
    days: 10
    on_form: true
    on_addendum: true
    why_excluded: null
  - depart: "2025-02-20"
    return: "2025-02-27"
    countries: ["Brazil"]
    days: 8
    on_form: true
    on_addendum: true
    why_excluded: null
  - depart: "2024-05-14"
    return: "2024-05-14"
    countries: ["Canada"]
    days: 1
    on_form: false
    on_addendum: false
    why_excluded: "day trip — entire trip completed within 24 hours (drove to Toronto and back same day); excluded from both the Part 8 table and the travel addendum per the form's own instruction and decision D7, not counted toward the 7 countable trips"
  - depart: "2024-03-10"
    return: "2024-03-17"
    countries: ["Brazil"]
    days: 8
    on_form: true
    on_addendum: true
    why_excluded: null
  - depart: "2023-08-18"
    return: "2023-08-25"
    countries: ["Germany"]
    days: 8
    on_form: true
    on_addendum: true
    why_excluded: null
  - depart: "2023-01-05"
    return: "2023-01-12"
    countries: ["Brazil"]
    days: 8
    on_form: true
    on_addendum: true
    why_excluded: null
  - depart: "2022-06-02"
    return: "2022-06-09"
    countries: ["Portugal"]
    days: 8
    on_form: true                              # 6th most-recent countable trip — the last that fits the table
    on_addendum: true
    why_excluded: null
  - depart: "2021-11-20"
    return: "2021-11-27"
    countries: ["Brazil"]
    days: 8
    on_form: false                             # 7th (oldest) countable trip — exceeds the 6-row table
