# Outcome[0] 402 | Outcome[2] 510, against the printed headers
# "What was the crime or offense?" | "Date of the Crime or Offense" |
# "Date of your conviction or guilty plea" | "Place of Crime or Offense" |
# "What was the result or disposition...?" | "What was your sentence?".
