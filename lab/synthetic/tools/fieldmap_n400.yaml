# ===========================================================================
# printed Part 10 — REQUEST FOR A FEE REDUCTION.
# "No" for all six clients (STYLE-SPEC §12.8), so the household-income and
# household-size fields stay EMPTY. Listed so the verifier can assert that.
# ===========================================================================
part10_fee_reduction:
  answer_group: 'form1[0].#subform[10].P10_Line1_Citizen'
  answer_values: {"Yes": /Y, "No": /N}
  answer_const: "No"
  leave_empty:
    - 'form1[0].#subform[10].P10_Line2_TotalHouseholdIn[0]'
    - 'form1[0].#subform[10].P10_Line3_HouseHoldSize[0]'
    - 'form1[0].#subform[10].P10_Line5b_NameOfHousehold[0]'
    - 'form1[0].#subform[10].P11_Line1_TotalChildren[1]'
  leave_empty_groups:
    - 'form1[0].#subform[10].P10_Line5a'

# ===========================================================================
# printed Part 11 — APPLICANT'S CONTACT INFORMATION, CERTIFICATION, SIGNATURE.
# §16 ruling 10, first half: items 3, 4, 5 ARE FILLED. Reproduced verbatim from
# n400-part-map.md's FILL list — exactly three fields, no more.
# ===========================================================================
part11_fill:
  contact.daytime_phone: 'form1[0].#subform[10].P12_Line3_Telephone[0]'
  contact.mobile_phone:  'form1[0].#subform[10].P12_Line3_Mobile[0]'
  contact.email:         'form1[0].#subform[10].P12_Line5_Email[0]'

# ===========================================================================
# LEAVE EMPTY — assert, do not merely omit.
# Verbatim from n400-part-map.md. verify_client.py must FIRST prove every one
# of these names EXISTS in the blank's 488-name set (SPEC-DELTA D-E: an
# assertion against a non-existent name passes vacuously while a filled
# preparer block ships), and only THEN assert it is empty.
# ===========================================================================
leave_empty:
  part11_signature:        # §16 r11 — the form ships UNSIGNED, no signature date
    - 'form1[0].#subform[10].P12_SignatureApplicant[0]'
    - 'form1[0].#subform[10].P13_DateofSignature[0]'
  part13_preparer:         # §16 r10 + r7 — no firm identity anywhere
    - 'form1[0].#subform[11].P15_Line1_PreparerFamilyName[0]'
    - 'form1[0].#subform[11].P15_Line1_PreparerGivenName[0]'
    - 'form1[0].#subform[11].P15_Line2_NameofBusinessorOrgName[0]'
    - 'form1[0].#subform[11].P15_Line4_Telephone[0]'
    - 'form1[0].#subform[11].P15_Line5_Mobile[0]'
    - 'form1[0].#subform[11].P15_Line6_Email[0]'
    - 'form1[0].#subform[11].P15_DateofSignature[0]'
    - 'form1[0].#subform[11].P12_SignatureApplicant[2]'
  part12_interpreter:      # no interpreter is engaged on any of the six matters
    - 'form1[0].#subform[11].P14_Line1_nterpreterFamilyName[0]'   # sic, the blank misspells it
    - 'form1[0].#subform[11].P14_Line1_nterpreterGivenName[0]'
    - 'form1[0].#subform[11].P14_Line2_NameofBusinessorOrgName[0]'
    - 'form1[0].#subform[11].P14_Line4_Telephone[0]'
    - 'form1[0].#subform[11].P14_Line5_Mobile[0]'
    - 'form1[0].#subform[11].P14_Line5_EmailAddress[0]'
    - 'form1[0].#subform[11].P14_NameOfLanguage[0]'
    - 'form1[0].#subform[11].P14_DateofSignature[0]'
    - 'form1[0].#subform[11].P12_SignatureApplicant[1]'
  parts_15_16:             # executed at the USCIS interview, never by the firm
    - 'form1[0].#subform[13].Part15ApplicantsSignature[0]'
    - 'form1[0].#subform[13].Part15DateofSignature[0]'
    - 'form1[0].#subform[13].Part15USCISSignature[0]'
    - 'form1[0].#subform[13].Part15USCISName[0]'
    - 'form1[0].#subform[13].ApplicantsSignature[0]'
    - 'form1[0].#subform[13].Part15DateofSignature[1]'

